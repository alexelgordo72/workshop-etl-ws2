version: '3.8'

x-airflow-common: &airflow-common
  image: workshop-etl-ws2_airflow-scheduler:latest
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ws2_admin:Ws2SecurePass2026!@postgres_ws2:5432/workshop_ws2
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_CORE_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/gcp-key.json
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./credentials:/opt/airflow/credentials
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres_ws2:
      condition: service_healthy
  networks:
    - ws2_network

services:
  postgres_ws2:
    image: postgres:16-alpine
    container_name: ws2_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - ws2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ws2_network

  airflow-webserver:
    <<: *airflow-common
    container_name: ws2_airflow_webserver
    command: webserver
    ports:
      - "8082:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: ws2_airflow_scheduler
    command: scheduler
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: ws2_airflow_init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Inicializando Airflow WS2"
        mkdir -p /opt/airflow/logs/scheduler
        mkdir -p /opt/airflow/logs/dag_processor_manager
        mkdir -p /opt/airflow/logs/webserver
        chmod -R 777 /opt/airflow/logs
        chown -R 50000:0 /opt/airflow/logs
        airflow db migrate
        airflow users create --username admin --firstname Admin --lastname WS2 --role Admin --email admin@ws2.local --password admin || true
        echo "AIRFLOW INICIALIZADO CORRECTAMENTE"

networks:
  ws2_network:
    driver: bridge

volumes:
  ws2_postgres_data:
